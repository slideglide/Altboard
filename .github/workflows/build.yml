name: Build Unsigned IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Bootstrap LlamaCpp
        run: ./scripts/bootstrap-llama.sh
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Build Unsigned Archive
        run: |
          xcodebuild archive \
            -project Sayboard.xcodeproj \
            -scheme Sayboard \
            -configuration Release \
            -archivePath build/Sayboard.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Sayboard.xcarchive/Products/Applications/Sayboard.app build/Payload/
          cd build && zip -r Altboard-unsigned.ipa Payload
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Altboard-unsigned
          path: build/Altboard-unsigned.ipa
